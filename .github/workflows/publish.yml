name: Publish Package to npmjs
on:
  workflow_dispatch:


jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Get versions
        run: |
          echo "OLD_VERSION=$(npm view js-table-builder version || echo 'Unknown')" >> $GITHUB_ENV
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Write Summary
        run: |
          echo "### 🚀 Successfully published \`js-table-builder\` to NPM!" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous Version**: v${{ env.OLD_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version**: v${{ env.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View v${{ env.NEW_VERSION }} on NPM](https://www.npmjs.com/package/js-table-builder/v/${{ env.NEW_VERSION }})" >> $GITHUB_STEP_SUMMARY
