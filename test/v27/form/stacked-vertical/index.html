<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to DOM — Form Stacked Vertical</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-slate-50 p-4">
    <div class="max-w-md mx-auto" style="max-width: 600px;">
        <div class="mb-4">
            <span class="badge bg-secondary px-3 py-2 fs-6 mb-2">Form Variation • Stacked Vertical</span>
            <h3 class="fw-bold text-dark mb-1">Stacked Vertical Payment Form</h3>
            <p class="text-secondary small mb-0">
                A single-column vertical layout with bottom submit & reset triggers.
            </p>
        </div>

        <!-- Live DOM Container -->
        <div class="mb-4">
            <div id="form-container"></div>
        </div>

        <!-- Action Event Feedback Box -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                <h6 class="mb-0 text-dark fw-semibold">Action Event Feedback:</h6>
                <span id="action-status-badge" class="badge bg-secondary">Awaiting Authorization...</span>
            </div>
            <div class="card-body p-3 bg-light">
                <pre id="action-result-box" class="p-3 bg-dark text-success font-monospace fw-medium small overflow-x-auto mb-0" style="min-height: 100px;">// Click "Authorize Payment" or "Reset Form"...</pre>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white border-bottom py-3">
                <h6 class="mb-0 text-success fw-semibold">Static HTML String:</h6>
            </div>
            <div class="card-body p-3 bg-light">
                <pre id="html-output-box" class="p-3 bg-dark text-light rounded font-monospace small overflow-x-auto mb-0" style="max-height: 180px;"></pre>
            </div>
        </div>
    </div>

    <!-- Import v27 module -->
    <script type="module" src="/src/v27/index.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
