<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Renderer • @keshavsoft/json-to-tag</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
    }
  </style>
</head>

<body class="p-3 p-md-4">
  <div class="container-fluid" style="max-width: 980px;">

    <!-- Top Navigation / Header -->
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom flex-wrap gap-2">
      <div>
        <h1 class="h4 fw-bold mb-1 text-dark d-flex align-items-center gap-2">
          <i class="bi bi-display text-primary"></i> Visual Renderer
          <span class="badge bg-success-subtle text-success border border-success-subtle fs-6 fw-normal">Render
            Mode</span>
        </h1>
        <p class="text-muted small mb-0">Direct DOM rendering of your JSON specification.</p>
      </div>
      <div class="d-flex gap-2">
        <a href="./index.html" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-grid me-1"></i> Menu
        </a>
        <a href="./editor.html" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-layout-split me-1"></i> Live Editor
        </a>
        <a href="./summery.html" class="btn btn-outline-info btn-sm">
          <i class="bi bi-journal-check me-1"></i> Tag Analysis
        </a>
        <a href="../samples/index.html" class="btn btn-outline-warning btn-sm" title="Download & View Samples">
          <i class="bi bi-collection me-1"></i> Samples
        </a>
      </div>
    </div>

    <!-- Minimal Controls Bar -->
    <div class="d-flex align-items-center gap-2 mb-4 p-2 bg-white rounded border shadow-sm flex-wrap">
      <label for="jsonFileInput" class="form-label mb-0 fw-semibold small text-secondary">
        <i class="bi bi-file-earmark-code text-primary me-1"></i>Select JSON:
      </label>
      <input type="file" id="jsonFileInput" class="form-control form-control-sm" accept=".json,application/json"
        style="max-width: 280px;" />
      <button class="btn btn-outline-secondary btn-sm" type="button" id="btnLoadSession" style="display: none;">
        <i class="bi bi-arrow-repeat me-1"></i> Load from Analysis
      </button>
      <span class="badge bg-light text-secondary border small ms-auto" id="activeFileNameBadge">No file loaded</span>
    </div>

    <!-- Output Container -->
    <div id="outputContainer"></div>

  </div>
  <script src="./show.js" type="module"></script>

</body>

</html>
