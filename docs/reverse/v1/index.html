<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload JSON to DOM | JSON to DOM (v14)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-7xl space-y-6 px-4 py-8">
        <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div class="border-b border-slate-200 bg-slate-50 px-6 py-4">
                <h1 class="text-xl font-bold text-slate-800">Upload JSON to DOM</h1>
                <p class="mt-1 text-sm text-slate-500">Choose any JSON spec file, then click the button to build and preview the DOM on this page.</p>
            </div>

            <div class="space-y-4 px-6 py-5">
                <div class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-end">
                    <div>
                        <label for="json-file-input" class="mb-2 block text-sm font-semibold text-slate-700">JSON File</label>
                        <input id="json-file-input" type="file" accept=".json,application/json"
                            class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 file:mr-3 file:rounded-md file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-slate-700 hover:file:bg-slate-200">
                    </div>

                    <button id="build-dom-btn" type="button"
                        class="rounded-lg border border-blue-600 bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 disabled:cursor-not-allowed disabled:border-slate-300 disabled:bg-slate-300"
                        disabled>
                        Build DOM
                    </button>
                </div>

                <div class="grid gap-3 sm:grid-cols-3">
                    <button id="load-sample-btn" type="button"
                        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                        Load Sample JSON
                    </button>
                    <button id="clear-json-btn" type="button"
                        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                        Clear JSON
                    </button>
                    <button id="clear-dom-btn" type="button"
                        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
                        Clear DOM Preview
                    </button>
                </div>

                <p id="status-message" class="text-sm text-slate-500">Upload a JSON file or load the sample to begin.</p>
            </div>
        </section>

        <section class="grid gap-6 xl:grid-cols-2">
            <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                <div class="border-b border-slate-200 bg-slate-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-slate-800">JSON Source</h2>
                </div>
                <div class="p-6">
                    <textarea id="json-editor" spellcheck="false"
                        class="min-h-[420px] w-full rounded-xl border border-slate-300 bg-slate-950 p-4 font-mono text-sm leading-6 text-emerald-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Upload a JSON spec file or click Load Sample JSON..."></textarea>
                </div>
            </article>

            <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
                <div class="border-b border-slate-200 bg-slate-50 px-6 py-4">
                    <h2 class="text-lg font-semibold text-slate-800">DOM Preview</h2>
                </div>
                <div class="bg-slate-50 px-6 py-4">
                    <p class="text-sm text-slate-500">The rendered DOM will appear below after you click <span class="font-semibold text-slate-700">Build DOM</span>.</p>
                </div>
                <div id="dom-preview" class="min-h-[420px] space-y-4 bg-white px-6 py-6"></div>
            </article>
        </section>
    </main>

    <script type="module">
        import { buildSpecElement } from "../../dist/v14/min.js";

        const fileInput = document.getElementById("json-file-input");
        const buildButton = document.getElementById("build-dom-btn");
        const loadSampleButton = document.getElementById("load-sample-btn");
        const clearJsonButton = document.getElementById("clear-json-btn");
        const clearDomButton = document.getElementById("clear-dom-btn");
        const jsonEditor = document.getElementById("json-editor");
        const domPreview = document.getElementById("dom-preview");
        const statusMessage = document.getElementById("status-message");

        const sampleSpec = {
            tagName: "div",
            attributes: {
                class: "mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
            },
            children: [
                {
                    tagName: "h2",
                    textContent: "Uploaded JSON Sample",
                    attributes: {
                        class: "text-xl font-bold text-slate-800"
                    }
                },
                {
                    tagName: "p",
                    textContent: "This sample shows how your JSON spec becomes live DOM in the preview panel.",
                    attributes: {
                        class: "mt-2 text-sm text-slate-500"
                    }
                },
                {
                    tagName: "div",
                    attributes: {
                        class: "mt-5 grid gap-3"
                    },
                    children: [
                        {
                            tagName: "label",
                            textContent: "User Name",
                            attributes: {
                                for: "sample-user-name",
                                class: "block text-sm font-semibold text-slate-700"
                            }
                        },
                        {
                            tagName: "input",
                            attributes: {
                                id: "sample-user-name",
                                type: "text",
                                placeholder: "Enter user name",
                                class: "w-full rounded-lg border border-slate-300 px-3 py-2"
                            }
                        },
                        {
                            tagName: "button",
                            textContent: "Save",
                            attributes: {
                                type: "button",
                                class: "inline-flex w-fit rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white"
                            }
                        }
                    ]
                }
            ]
        };

        const setStatus = ({ inText, inIsError = false } = {}) => {
            if (!statusMessage) return;

            statusMessage.textContent = inText || "";
            statusMessage.className = inIsError
                ? "text-sm text-rose-600"
                : "text-sm text-slate-500";
        };

        const setBuildEnabled = ({ inEnabled } = {}) => {
            if (!buildButton) return;
            buildButton.disabled = !inEnabled;
        };

        const clearPreview = () => {
            if (domPreview) {
                domPreview.innerHTML = "";
            }
        };

        const readTextFile = ({ inFile } = {}) => {
            const localFile = inFile;

            if (!localFile) {
                return Promise.resolve("");
            }

            return new Promise((resolve, reject) => {
                const fileReader = new FileReader();

                fileReader.onload = () => resolve(String(fileReader.result || ""));
                fileReader.onerror = () => reject(fileReader.error || new Error("Could not read file"));

                fileReader.readAsText(localFile);
            });
        };

        const getParsedSpec = () => {
            const rawJson = jsonEditor?.value?.trim();

            if (!rawJson) {
                setStatus({ inText: "Please upload or enter JSON first.", inIsError: true });
                return null;
            }

            try {
                return JSON.parse(rawJson);
            } catch (error) {
                setStatus({ inText: `Invalid JSON: ${error.message}`, inIsError: true });
                return null;
            }
        };

        const renderSpec = ({ inSpec } = {}) => {
            const localSpec = inSpec;

            if (localSpec === null || localSpec === undefined) {
                setStatus({ inText: "Parsed JSON is empty.", inIsError: true });
                return null;
            }

            clearPreview();

            const builtNode = buildSpecElement({
                inSpec: localSpec,
                inApplyEvents: false
            });

            if (!builtNode) {
                setStatus({ inText: "Could not build DOM from the supplied JSON.", inIsError: true });
                return null;
            }

            if (Array.isArray(builtNode)) {
                domPreview?.append(...builtNode);
            } else {
                domPreview?.appendChild(builtNode);
            }

            globalThis.lastUploadedSpec = localSpec;
            globalThis.lastBuiltDom = builtNode;

            setStatus({ inText: "DOM built successfully from JSON." });
            return builtNode;
        };

        const handleBuildClick = () => {
            const parsedSpec = getParsedSpec();
            if (parsedSpec === null) return;

            renderSpec({ inSpec: parsedSpec });
        };

        const handleFileChange = async () => {
            const selectedFile = fileInput?.files?.[0];

            if (!selectedFile) {
                setBuildEnabled({ inEnabled: Boolean(jsonEditor?.value?.trim()) });
                setStatus({ inText: "No file selected." });
                return;
            }

            try {
                const fileText = await readTextFile({ inFile: selectedFile });
                if (jsonEditor) {
                    jsonEditor.value = fileText;
                }
                setBuildEnabled({ inEnabled: true });
                setStatus({ inText: `Loaded ${selectedFile.name}. Click Build DOM to render it.` });
            } catch (error) {
                setBuildEnabled({ inEnabled: false });
                setStatus({ inText: `Could not read file: ${error.message}`, inIsError: true });
            }
        };

        const loadSample = () => {
            if (jsonEditor) {
                jsonEditor.value = JSON.stringify(sampleSpec, null, 2);
            }
            setBuildEnabled({ inEnabled: true });
            setStatus({ inText: "Sample JSON loaded. Click Build DOM to render it." });
        };

        const clearJson = () => {
            if (jsonEditor) {
                jsonEditor.value = "";
            }
            if (fileInput) {
                fileInput.value = "";
            }
            setBuildEnabled({ inEnabled: false });
            setStatus({ inText: "JSON cleared." });
        };

        fileInput?.addEventListener("change", handleFileChange);
        buildButton?.addEventListener("click", handleBuildClick);
        loadSampleButton?.addEventListener("click", loadSample);
        clearJsonButton?.addEventListener("click", clearJson);
        clearDomButton?.addEventListener("click", () => {
            clearPreview();
            setStatus({ inText: "DOM preview cleared." });
        });
        jsonEditor?.addEventListener("input", () => {
            setBuildEnabled({ inEnabled: Boolean(jsonEditor.value.trim()) });
        });

        setBuildEnabled({ inEnabled: false });
    </script>
</body>

</html>
