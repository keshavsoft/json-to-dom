<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>4. actions — Live Browser Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        pre, code { font-family: 'JetBrains Mono', monospace; }

<body class="p-4">
    <div class="container" style="max-width: 900px;">
        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
            <div>
                <a href="../index.html" class="text-decoration-none small text-muted">← Back to v29 Test Dashboard</a>
                <h3 class="fw-bold text-dark mt-1 mb-0">4. actions (bindActions)</h3>

            </div>
            <span id="action-status-badge" class="badge bg-secondary px-3 py-2 fs-6">Awaiting Action Click...</span>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3">

                    </div>
                    <div class="card-body p-4 bg-white" id="form-container">
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm border-0 h-100">

                        <span id="event-type-badge" class="badge bg-light text-dark border">No event yet</span>
                    </div>
                    <div class="card-body p-3 bg-light">
                        <pre id="action-payload-box" class="p-3 bg-dark text-success rounded small mb-0" style="min-height: 220px; overflow-y: auto;">// Click "Save Voucher" or "Cancel / Reset" to see live captured payload...</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./index.js"></script>
